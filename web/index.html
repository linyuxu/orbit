<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* A phone gets the phone's app (web/m/), with the same query, unless it chose the desktop layout there. A tablet (an
   iPad, upright 744-1024 px wide) gets this page, made for touch where the pointer is a finger (touch.js). */
try { if (window.top === window && matchMedia("(pointer: coarse) and (max-width: 600px), (pointer: coarse) and (max-height: 500px)").matches && localStorage.getItem("orbit.forceDesktop") !== "1") location.replace("/m/" + location.search); } catch (e) {}</script>

<body>
<div id="app">
  <header id="titlebar" data-tauri-drag-region="deep">
    <div class="lead">
      <button class="ibtn" id="lefttog" title="Left panel (⌘1)"></button>
      <img id="logo" src="/vendor/logo.png" onerror="this.onerror=null;this.src='/vendor/logo.svg'" alt="">
      <button id="grouppill" title="The group's home (its ▾: another group; ⌘1 Favorites, ⌘2… groups)"></button>
    </div>
    <div id="tabs" role="tablist"></div>
    <button id="revbadge" hidden title="± Review: uncommitted changes (⌘⇧I)"></button>
  </header>
  <div id="body">
    <aside id="left" hidden>
      <div class="phead">
        <div class="ptabs" id="ptabs"></div>
      </div>
      <div class="pfrow">
        <div class="pfbox" id="pfbox"></div>
        <button class="ibtn sm" id="followbtn" title="Follow: reveal the current tab in this list (⌘E → More → Follow)"></button>
        <button class="ibtn sm" id="paddbtn" title="New: a session (⌘N), a file, a note or a schedule, by the panel tab"></button>
      </div>
      <div class="pmach" id="pmach" hidden></div>
      <div class="plist" id="plist" tabindex="0"></div>
      <div id="ppeek" hidden></div>
      <div id="pside" hidden></div>
    </aside>
    <div class="vsplit" id="lsplit" hidden title="Drag to resize (⌃⌥H ⌃⌥L)"></div>
    <div id="work">
    <main id="main">
      <div id="pane">
        <div id="findbar" hidden><input id="findq" placeholder="Find" spellcheck="false" autocomplete="off"><span id="findn"></span>
          <button class="ibtn sm" data-f="-1" title="Previous (⇧⏎ · ⌘⇧G)"></button><button class="ibtn sm" data-f="1" title="Next (⏎ · ⌘G)"></button>
          <button class="ibtn sm" data-f="close" title="Close (Esc)"></button></div>
        <div id="sessview">
          <div id="conv" tabindex="-1"><div class="col" id="cards"></div><div class="col" id="livecaps" hidden></div></div>
          <button id="jump" title="Scroll to the latest answer (⌘L)"></button>
          <div id="composer-wrap">
            <div id="agentbar" hidden></div>
            <div class="composer" id="composer">
              <div id="mentionpop" hidden role="listbox"></div>
              <div id="editing" hidden></div>
              <div id="voiceorb" hidden><svg class="vorb" viewBox="0 0 100 100" aria-hidden="true"></svg><div class="vorbst" aria-live="polite"></div><button type="button" class="ibtn sm vtype" title="Type instead (the call goes on)"></button></div>
              <div id="inputhost" title="⌘⏎ sends · ⏎ new line · @ a file · / a skill · @@ another session · ↑ in an empty input: history"></div>
              <div class="crow">
                <button class="ibtn sm" id="attach" title="Attach a file or image: the agent gets its path (⌘V or drop works too)"></button>
                <input type="file" id="attachfile" multiple hidden>
                <button class="chip" id="modechip" title="Permission mode"></button>
                <span class="runon" id="runon" title="Click: /model · /effort"></span>
                <span class="runhint" id="runhint"></span>
                <span class="callst" id="callst" hidden></span>
                <button class="ibtn sm" id="callbtn" title="Voice call with this session (⌘⇧V)" disabled></button>
                <button id="send" title="Send (⌘⏎)" disabled></button>
              </div>
            </div>
          </div>
        </div>
        <div id="fileview" hidden>
          <div class="fhead" id="fhead"></div>
          <div class="banner" id="fbanner" hidden></div>
          <div id="fbody"></div>
          <div class="backlinks" id="fback" hidden></div>
        </div>
        <div id="reviewview" hidden>
          <div class="rvhead" id="rvhead"></div>
          <div id="rvbody" tabindex="-1"></div>
        </div>
        <div id="pview" hidden></div>
        <div id="xview" hidden>
          <div class="rvhead" id="xhead"></div>
          <div id="xbody" tabindex="-1"></div>
          <div id="xnote" hidden></div>
          <div class="xfoot" id="xfoot"></div>
        </div>
      </div>
      <div class="vsplit" id="ssplit" hidden title="Drag to resize (⌃⌥H ⌃⌥L)"></div>
      <section id="side" hidden>
        <div class="shead"><div id="sidetabs" role="tablist"></div>
          <button class="ibtn sm" id="sidehide" title="Hide the side panel: its tabs are kept (⌘\)"></button>
          <button class="ibtn sm" id="sidefocus" title="Keyboard: main ⇄ side tab (⌘⇧O)"></button>
          <button class="ibtn sm" id="sideclose" title="Close the side tab (⌘W there)"></button></div>
        <div id="sideweb" hidden></div>
        <div id="sideframes"></div>
      </section>
      <button id="sidepeek" hidden></button>
    </main>
  <button id="quotebtn" title="Quote the selection into the input (⌘E: more)"></button>
    <div class="hsplit" id="hsplit" hidden title="Drag to resize (⌃⌥K ⌃⌥J)"></div>
    <section id="shell" hidden>
      <div class="shhead"><span class="t" id="shtitle"></span>
        <button class="qbtn" id="shkill" title="Kill the shell (it restarts on ⏎)"></button>
        <button class="qbtn" id="shterm" title="Open the folder in iTerm"></button>
        <button class="ibtn sm" id="shclose" title="Hide the shell (⌘J)"></button></div>
      <div id="term"></div>
    </section>
    <footer id="statusbar">
      <button class="callpill" id="callpill" hidden aria-haspopup="menu"></button>
      <span class="seg" id="sb-state"></span>
      <span class="seg" id="sb-harness"></span>
      <span class="seg" id="sb-extra"></span>
      <span class="right">
        <span class="seg" id="sb-plugins" hidden></span>
        <button class="usage" id="sb-usage" hidden title="Plan usage of each harness (click for details)"></button>
        <span class="seg" id="sb-folder"></span>
        <button class="ibtn sm" id="bellbtn" title="Notifications (⌘I)"></button>
        <button class="sbmeet" id="sbmeet" hidden title="Next meeting: join or open its note (⌘⇧C)"></button>
        <button class="ibtn sm" id="morebtn" title="More (also ⌘E → More)"></button>
      </span>
    </footer>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="lightbox"><img alt=""></div>
