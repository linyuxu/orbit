[package]
name = "orbit-app"
version = "0.2.0"
description = "Orbit app shell: native window and menu around the server's page"
edition = "2021"
rust-version = "1.85"
# MSRV-aware resolution: pick dependency versions this toolchain can build.
resolver = "3"

[[bin]]
name = "orbit-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libc = "0.2"
serde_json = "1"

[profile.release]
strip = true
